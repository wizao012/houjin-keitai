  :root {
    --navy: #071b3a;
    --navy-deep: #03102a;
    --gold: #d8a24a;
    --text: #1a1a1a;
    --text-gray: #6a6a6a;
    --bg: #f5f6f8;
    --line: #e3e6ec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
    font-size: 14px;
    -webkit-text-size-adjust: 100%;
  }

  .header {
    background: var(--navy);
    padding: 14px 16px;
    text-align: center;
  }

  .header h1 {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .page-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--navy);
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }

  .page-title-en {
    font-size: 11px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 24px;
    letter-spacing: 0.2em;
    font-weight: 600;
  }

  .info-table {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .info-row {
    display: flex;
    border-bottom: 1px solid var(--line);
  }

  .info-row:last-child {
    border-bottom: none;
  }

  .info-label {
    background: #f8f9fb;
    color: var(--navy);
    font-weight: 700;
    padding: 14px 12px;
    width: 130px;
    flex-shrink: 0;
    font-size: 13px;
    border-right: 1px solid var(--line);
  }

  .info-value {
    padding: 14px 14px;
    font-size: 13px;
    color: var(--text);
    flex: 1;
    word-break: break-word;
  }

  .info-value a {
    color: var(--navy);
    text-decoration: underline;
  }

  .info-value ul {
    list-style: none;
    padding: 0;
  }

  .info-value ul li {
    position: relative;
    padding-left: 14px;
  }

  .info-value ul li::before {
    content: "・";
    position: absolute;
    left: 0;
    color: var(--gold);
    font-weight: 700;
  }

  .back-btn {
    display: block;
    width: fit-content;
    margin: 32px auto 0;
    padding: 12px 32px;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(7, 27, 58, 0.22);
  }

  .footer {
    background: var(--navy-deep);
    color: #fff;
    padding: 20px 14px;
    text-align: center;
    margin-top: 30px;
  }

  .footer-copy {
    font-size: 11px;
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    .info-label {
      width: 100px;
      font-size: 12px;
      padding: 12px 10px;
    }
    .info-value {
      font-size: 12px;
      padding: 12px 10px;
    }
    .page-title {
      font-size: 18px;
    }
  }
